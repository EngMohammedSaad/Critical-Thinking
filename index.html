<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Critical Thinking Reasersher CnU</title>

    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js"></script>

if (typeof pptxgen === "undefined" && typeof PptxGenJS !== "undefined")

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #eef2f7;
            --panel: #ffffff;
            --panel-2: #f6f8fc;
            --border: #e2e8f0;
            --text: #172033;
            --muted: #718096;
            --primary: #5b5ce2;
            --primary-dark: #494acb;
            --danger: #ef4444;
            --shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
            --radius: 18px;
        }

        body {
            font-family: "Cairo", "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 68px;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            gap: 16px;
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 180px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: grid;
            place-items: center;
            color: white;
            font-weight: 900;
            font-size: 18px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .brand-text strong {
            font-size: 16px;
        }

        .brand-text span {
            font-size: 11px;
            color: var(--muted);
            margin-top: 3px;
        }

        .file-name {
            height: 38px;
            width: 260px;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            transition: 0.2s;
        }

        .file-name:hover,
        .file-name:focus {
            border-color: var(--border);
            background: var(--panel-2);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-btn {
            min-width: 42px;
            height: 40px;
            padding: 0 13px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            transition: 0.2s;
        }

        .top-btn:hover {
            transform: translateY(-1px);
            background: #fff;
            box-shadow: var(--shadow);
        }

        .top-btn.primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .top-btn.primary:hover {
            background: var(--primary-dark);
        }

        .top-btn.export {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }

        .top-btn.export:hover {
            background: #059669;
        }

        .workspace {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 230px minmax(0, 1fr) 320px;
            direction: ltr;
        }

        .slides-panel {
            direction: rtl;
            background: #f8fafc;
            border-left: 1px solid var(--border);
            padding: 14px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .panel-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 900;
        }

        .small-action {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: white;
            border: 1px solid var(--border);
            font-size: 18px;
            color: var(--primary);
        }

        .slides-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
        }

        .slide-thumb {
            position: relative;
            background: white;
            border: 2px solid transparent;
            border-radius: 13px;
            margin-bottom: 12px;
            padding: 7px;
            cursor: pointer;
            transition: 0.2s;
        }

        .slide-thumb:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.07);
        }

        .slide-thumb.active {
            border-color: var(--primary);
            box-shadow: 0 8px 25px rgba(91, 92, 226, 0.15);
        }

        .thumb-canvas {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .thumb-content {
            position: absolute;
            inset: 0;
            padding: 10px;
        }

        .thumb-title {
            font-size: 9px;
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .thumb-line {
            height: 3px;
            width: 70%;
            margin-top: 5px;
            border-radius: 20px;
            opacity: 0.45;
        }

        .thumb-label {
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
            font-weight: 700;
            padding: 0 3px;
        }

        .slide-delete {
            position: absolute;
            left: 8px;
            top: 8px;
            width: 25px;
            height: 25px;
            border-radius: 7px;
            background: rgba(239, 68, 68, 0.95);
            color: #fff;
            font-size: 12px;
            opacity: 0;
            transition: 0.2s;
        }

        .slide-thumb:hover .slide-delete {
            opacity: 1;
        }

        .editor-area {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 20% 20%, rgba(99,102,241,0.04), transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(16,185,129,0.04), transparent 30%),
                #edf1f6;
            direction: rtl;
        }

        .editor-toolbar {
            height: 52px;
            flex: 0 0 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
        }

        .editor-toolbar-left,
        .editor-toolbar-right {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .tool-pill {
            height: 34px;
            display: flex;
            align-items: center;
            padding: 0 11px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .tool-button {
            width: 36px;
            height: 34px;
            border-radius: 9px;
            background: white;
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 13px;
        }

        .tool-button:hover {
            background: #f8fafc;
        }

        .stage-area {
            flex: 1;
            min-height: 0;
            display: grid;
            place-items: center;
            padding: 25px;
            overflow: auto;
        }

        .stage-wrap {
            width: min(920px, 100%);
            position: relative;
        }

        .slide-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 18px;
            background: white;
            box-shadow:
                0 25px 65px rgba(15, 23, 42, 0.16),
                0 4px 15px rgba(15, 23, 42, 0.06);
        }

        .slide-decor {
            position: absolute;
            pointer-events: none;
        }

        .slide-element {
            position: absolute;
            user-select: none;
        }

        .main-title {
            white-space: pre-wrap;
            overflow: hidden;
        }

        .paragraph-box {
            border: 1.5px solid transparent;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .paragraph-box:hover {
            border-color: rgba(91, 92, 226, 0.22);
            background: rgba(91, 92, 226, 0.035);
        }

        .paragraph-box.selected {
            border-color: var(--primary);
            background: rgba(91, 92, 226, 0.06);
            box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.08);
        }

        .paragraph-heading {
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 7px;
            word-break: break-word;
        }

        .paragraph-body {
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .empty-slide {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: rgba(100, 116, 139, 0.7);
            font-size: 18px;
            font-weight: 800;
            pointer-events: none;
        }

        .inspector {
            direction: rtl;
            background: white;
            border-right: 1px solid var(--border);
            min-width: 0;
            overflow-y: auto;
        }

        .inspector-header {
            padding: 17px 17px 10px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(10px);
            z-index: 5;
        }

        .inspector-header h2 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .inspector-header p {
            color: var(--muted);
            font-size: 11px;
        }

        .inspector-content {
            padding: 15px;
        }

        .section {
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 900;
            margin-bottom: 9px;
            color: #334155;
        }

        .field {
            margin-bottom: 10px;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            border: 1px solid var(--border);
            background: #f8fafc;
            border-radius: 10px;
            outline: none;
            color: var(--text);
            transition: 0.2s;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(91,92,226,.08);
        }

        .field input {
            height: 38px;
            padding: 0 10px;
            font-size: 12px;
        }

        .field textarea {
            min-height: 86px;
            resize: vertical;
            padding: 10px;
            font-size: 12px;
            line-height: 1.7;
        }

        .field select {
            height: 38px;
            padding: 0 10px;
            font-size: 12px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 7px;
        }

        .color-row {
            display: flex;
            gap: 8px;
        }

        input[type="color"] {
            padding: 3px;
            height: 38px;
            cursor: pointer;
        }

        .mini-btn {
            flex: 1;
            height: 38px;
            border-radius: 9px;
            background: #f8fafc;
            border: 1px solid var(--border);
            font-size: 12px;
            font-weight: 800;
        }

        .mini-btn.active {
            background: rgba(91,92,226,.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        .add-paragraph {
            width: 100%;
            height: 42px;
            border-radius: 11px;
            background: var(--primary);
            color: white;
            font-size: 12px;
            font-weight: 900;
            margin-top: 4px;
        }

        .add-paragraph:hover {
            background: var(--primary-dark);
        }

        .delete-element {
            width: 100%;
            height: 40px;
            border-radius: 10px;
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #e11d48;
            font-weight: 900;
            font-size: 12px;
        }

        .delete-element:hover {
            background: #ffe4e6;
        }

        .animation-preview {
            margin-top: 9px;
            background: #111827;
            color: white;
            border-radius: 12px;
            padding: 14px;
            min-height: 85px;
            display: grid;
            place-items: center;
            overflow: hidden;
            position: relative;
        }

        .animation-demo {
            font-weight: 900;
            font-size: 16px;
        }

        .animation-demo.play {
            animation-duration: 900ms;
            animation-fill-mode: both;
        }

        @keyframes fadeInCustom {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUpCustom {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideLeftCustom {
            from {
                opacity: 0;
                transform: translateX(-45px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideRightCustom {
            from {
                opacity: 0;
                transform: translateX(45px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes zoomInCustom {
            from {
                opacity: 0;
                transform: scale(.55);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes popCustom {
            0% {
                opacity: 0;
                transform: scale(.65);
            }

            65% {
                opacity: 1;
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes rotateInCustom {
            from {
                opacity: 0;
                transform: rotate(-8deg) translateY(15px);
            }
            to {
                opacity: 1;
                transform: rotate(0) translateY(0);
            }
        }

        @keyframes typewriterCustom {
            from {
                clip-path: inset(0 100% 0 0);
            }
            to {
                clip-path: inset(0 0 0 0);
            }
        }

        .anim-fade.play {
            animation-name: fadeInCustom;
        }

        .anim-slideUp.play {
            animation-name: slideUpCustom;
        }

        .anim-slideLeft.play {
            animation-name: slideLeftCustom;
        }

        .anim-slideRight.play {
            animation-name: slideRightCustom;
        }

        .anim-zoom.play {
            animation-name: zoomInCustom;
        }

        .anim-pop.play {
            animation-name: popCustom;
        }

        .anim-rotate.play {
            animation-name: rotateInCustom;
        }

        .anim-typewriter.play {
            animation-name: typewriterCustom;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.56);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .modal.open {
            display: flex;
        }

        .modal-card {
            width: min(1050px, 96vw);
            max-height: 92vh;
            background: white;
            border-radius: 22px;
            box-shadow: 0 35px 90px rgba(15,23,42,.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h3 {
            font-size: 15px;
        }

        .close-modal {
            width: 35px;
            height: 35px;
            border-radius: 9px;
            background: #f1f5f9;
            color: #334155;
            font-size: 16px;
        }

        .templates-grid {
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
        }

        .template-card {
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 9px;
            background: #f8fafc;
            cursor: pointer;
            transition: 0.2s;
        }

        .template-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            border-color: rgba(91,92,226,.2);
        }

        .template-preview {
            aspect-ratio: 16 / 9;
            border-radius: 11px;
            overflow: hidden;
            position: relative;
        }

        .template-preview-title {
            position: absolute;
            right: 12px;
            left: 12px;
            top: 13px;
            font-weight: 900;
            font-size: 13px;
        }

        .template-preview-line {
            position: absolute;
            right: 12px;
            width: 54%;
            height: 4px;
            border-radius: 20px;
            top: 40px;
            opacity: .4;
        }

        .template-card-name {
            padding: 8px 3px 1px;
            font-size: 12px;
            font-weight: 900;
        }

        .preview-modal .modal-card {
            width: min(1200px, 96vw);
            background: #0f172a;
        }

        .preview-header {
            color: white;
            border-color: rgba(255,255,255,.08);
        }

        .preview-header .close-modal {
            background: rgba(255,255,255,.1);
            color: white;
        }

        .preview-body {
            padding: 25px;
            display: grid;
            place-items: center;
        }

        .preview-stage {
            width: min(1000px, 100%);
            aspect-ratio: 16 / 9;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0,0,0,.35);
        }

        .preview-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 0 0 20px;
        }

        .preview-control-btn {
            height: 40px;
            padding: 0 17px;
            border-radius: 10px;
            background: rgba(255,255,255,.1);
            color: white;
            border: 1px solid rgba(255,255,255,.12);
            font-weight: 800;
        }

        .preview-control-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translate(-50%, 20px);
            padding: 12px 17px;
            border-radius: 11px;
            background: #0f172a;
            color: white;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            z-index: 500;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 1100px) {
            .workspace {
                grid-template-columns: 190px minmax(0, 1fr) 290px;
            }

            .brand-text {
                display: none;
            }
        }

        @media (max-width: 850px) {
            body {
                overflow: auto;
            }

            .app {
                min-height: 100vh;
                height: auto;
            }

            .workspace {
                grid-template-columns: 1fr;
            }

            .slides-panel {
                display: none;
            }

            .inspector {
                border-top: 1px solid var(--border);
                border-right: none;
                max-height: 500px;
            }

            .editor-area {
                min-height: 70vh;
            }

            .topbar {
                flex-wrap: wrap;
                height: auto;
                padding: 10px;
            }

            .file-name {
                order: 3;
                width: 100%;
            }

            .templates-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .templates-grid {
                grid-template-columns: 1fr;
            }

            .stage-area {
                padding: 10px;
            }
        }

.topbar{height:auto;min-height:68px;flex-wrap:wrap;padding:8px 14px;gap:8px 12px}
.brand{min-width:0;flex:0 0 auto}
.file-name{flex:1 1 160px;width:auto;min-width:120px;max-width:340px}
.top-actions{flex-wrap:wrap;justify-content:flex-end;gap:6px}
.top-btn{white-space:nowrap;height:36px;padding:0 11px}
.editor-toolbar{height:auto;flex:0 0 auto;min-height:52px;flex-wrap:wrap;gap:8px;padding:8px 18px}
.tool-button{width:auto;min-width:36px;padding:0 10px;white-space:nowrap;font-weight:700}
.slide-image{position:absolute;z-index:5;cursor:move;touch-action:none;outline:2px solid transparent;overflow:hidden}
.slide-image img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;border-radius:4px;object-fit:cover}
.slide-image.selected{outline-color:var(--primary)}
.slide-image .rz{display:none;position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;background:var(--primary);border:2px solid #fff;border-radius:50%;cursor:nwse-resize}
.slide-image.selected .rz{display:block}
#present{position:fixed;inset:0;background:#000;z-index:1000;overflow:hidden}
.pstage{position:absolute;left:50%;top:50%;width:920px;height:517.5px;margin:-258.75px 0 0 -460px;overflow:hidden}
.pinfo{position:absolute;bottom:10px;left:14px;color:rgba(255,255,255,.4);font:12px sans-serif}

.ic{width:16px;height:16px;fill:currentColor;vertical-align:-3px;margin-inline-end:5px}
.menu-wrap{position:relative}.menu{display:none;position:absolute;top:42px;inset-inline-start:0;min-width:190px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.18);padding:6px;z-index:900;flex-direction:column;gap:2px}
.menu.open{display:flex}.menu button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font:600 13px Cairo,sans-serif;color:#0f172a;white-space:nowrap}.menu button:hover{background:#eff6ff}
.topbar{flex-wrap:nowrap}.top-actions{flex-wrap:nowrap;margin-inline-start:auto}
.workspace{min-height:0}.editor-area{min-width:0}.stage-area{min-height:0;overflow:auto}
.slide-thumb.dragging{opacity:.4}.slide-thumb.over{outline:2px dashed #2563eb}
.sdel{position:absolute;top:4px;inset-inline-end:4px;width:22px;height:22px;border-radius:50%;background:#fff;color:#dc2626;font:700 14px/22px sans-serif;text-align:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);z-index:3}
@media(min-width:901px){.workspace{grid-template-rows:minmax(0,1fr);height:calc(100vh - 68px)}.app{height:100vh;overflow:hidden}
.editor-area{min-height:0;height:100%;display:flex;flex-direction:column}.stage-area{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
.stage-wrap{width:min(920px,100%,calc((100vh - 190px)*16/9))!important}
.slides-panel,.inspector{min-height:0;overflow-y:auto}.slides-list{overflow-y:auto;min-height:0}
}

.inspector-nav{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:7px;
    margin-top:12px;
}
.inspector-nav button{
    min-height:34px;
    padding:0 9px;
    border:1px solid var(--border);
    background:#f8fafc;
    color:var(--text);
    border-radius:9px;
    font:800 11px Cairo,sans-serif;
    cursor:pointer;
    transition:.2s;
}
.inspector-nav button:hover:not(:disabled){
    background:#fff;
    border-color:var(--primary);
    color:var(--primary);
    transform:translateY(-1px);
}
.inspector-nav button:disabled{
    opacity:.35;
    cursor:not-allowed;
}
.inspector-nav span{
    min-width:50px;
    text-align:center;
    color:var(--muted);
    font:800 11px Cairo,sans-serif;
    direction:ltr;
}
.settings-group-title{
    padding:8px 10px 5px;
    color:#94a3b8;
    font-size:10px;
    font-weight:900;
    pointer-events:none;
}
.settings-divider{
    height:1px;
    background:#e2e8f0;
    margin:6px 2px;
}
#setMenu{
    min-width:220px;
}
</style>
</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="brand">
            <div class="brand-logo">E</div>

            <div class="brand-text">
                <strong>Eto Presenter</strong>
                <span>Presentation Builder</span>
            </div>
        </div>

        <input
            id="fileName"
            class="file-name"
            value="Presentation"
            spellcheck="false"
        >

        <div class="top-actions">
<button class="top-btn" onclick="openPreview()"><svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>تشغيل</button>
<button class="top-btn primary" onclick="saveProject()"><svg class="ic" viewBox="0 0 24 24"><path d="M5 3h12l4 4v14H3V3zm4 0v5h6V3M7 21v-7h10v7" fill="none" stroke="currentColor" stroke-width="2"/></svg>حفظ</button>
<div class="menu-wrap"><button class="top-btn export" onclick="toggleMenu('expMenu',event)">تصدير ▾</button>
<div class="menu" id="expMenu"><button onclick="exportPPTX()">PowerPoint ‏(PPTX)</button><button onclick="exportVideo()">فيديو MP4</button></div></div>
<div class="menu-wrap"><button class="top-btn" title="الإعدادات" onclick="toggleMenu('setMenu',event)"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2"/></svg></button>
<div class="menu" id="setMenu"></div></div>
</div></header>

    <main class="workspace">

        <aside class="slides-panel">

            <div class="panel-title-row">

                <div class="panel-title">
                    الشرائح
                </div>

                <button
                    class="small-action"
                    title="إضافة شريحة"
                    onclick="addSlide()"
                >
                    +
                </button>

            </div>

            <div id="slidesList" class="slides-list"></div>

        </aside>

        <section class="editor-area">

            <div class="editor-toolbar">

                <div class="editor-toolbar-right">
                    
                    <button class="tool-button" onclick="addParagraph()">＋ فقرة</button>
                    <button class="tool-button" onclick="openImagePlace()">صورة</button>
<button class="tool-button" onclick="openVideo()">فيديو</button>
                    <button class="tool-button" title="تكبير" onclick="zoomStage(1.1)">+</button>
                    <button class="tool-button" title="تصغير" onclick="zoomStage(0.9)">−</button>
                </div>
                <div class="editor-toolbar-left"></div></div>
<div class="stage-area">

                <div
                    id="stageWrap"
                    class="stage-wrap"
                >

                    <div
                        id="slideStage"
                        class="slide-stage"
                    ></div>

                </div>

            </div>

        </section>

        <aside class="inspector">

            <div class="inspector-header">

                <h2 id="inspectorTitle">
                    تعديل العنصر
                </h2>

                <p id="inspectorDescription">
                    اختر عنوانًا أو فقرة أو صورة لتعديلها
                </p>

                <div class="inspector-nav">
                    <button
                        type="button"
                        id="editorPrevBtn"
                        onclick="previousEditorSlide()"
                    >
                        → السابق
                    </button>

                    <span id="editorSlideCounter">1 / 1</span>

                    <button
                        type="button"
                        id="editorNextBtn"
                        onclick="nextEditorSlide()"
                    >
                        التالي ←
                    </button>
                </div>

            </div>

            <div
                id="inspectorContent"
                class="inspector-content"
            ></div>

        </aside>

    </main>

</div>

<div
    id="templatesModal"
    class="modal"
>

    <div class="modal-card">

        <div class="modal-header">

            <h3>
                القوالب الجاهزة
            </h3>

            <button
                class="close-modal"
                onclick="closeTemplates()"
            >
                ×
            </button>

        </div>

        <div
            id="templatesGrid"
            class="templates-grid"
        ></div>

    </div>

</div>

<div
    id="previewModal"
    class="modal preview-modal"
>

    <div class="modal-card">

        <div class="modal-header preview-header">

            <h3>
                Presentation Preview
            </h3>

            <button
                class="close-modal"
                onclick="closePreview()"
            >
                ×
            </button>

        </div>

        <div class="preview-body">

            <div
                id="previewStage"
                class="preview-stage"
            ></div>

            <div class="preview-controls">

                <button
                    class="preview-control-btn"
                    onclick="previousSlide()"
                >
                    السابق
                </button>

                <button
                    class="preview-control-btn primary"
                    onclick="replayPreview()"
                >
                    Replay
                </button>

                <button
                    class="preview-control-btn"
                    onclick="nextSlide()"
                >
                    التالي
                </button>

            </div>

        </div>

    </div>

</div>

<div
    id="toast"
    class="toast"
></div>

<script>
"use strict";
const state = {
    fileName: "Presentation",
    activeSlide: 0,
    selectedElement: {
        type: "title",
        index: -1
    },
    zoom: 1,
    slides: [
        {
            id: crypto.randomUUID(),
            title: "عنوان العرض التقديمي",
            theme: "aurora",
            paragraphs: [
                {
                    id: crypto.randomUUID(),
                    heading: "العنوان الأول",
                    body: "اكتب هنا أول فقرة تريد ظهورها في العرض التقديمي.",
                    fontSize: 25,
                    color: "#ffffff",
                    animation: "slideUp",
                    duration: 0.9,
                    delay: 0,
                    align: "right",
                    bold: false
                },
                {
                    id: crypto.randomUUID(),
                    heading: "العنوان الثاني",
                    body: "يمكنك إضافة فقرة جديدة واختيار Animation مختلف لها.",
                    fontSize: 22,
                    color: "#ffffff",
                    animation: "fade",
                    duration: 0.8,
                    delay: 0.25,
                    align: "right",
                    bold: false
                }
            ]
        }
    ]
};
const themes = {
    minimal: {
        name: "Minimal",
        background: "#f8fafc",
        titleColor: "#111827",
        bodyColor: "#334155",
        accent: "#5b5ce2",
        font: "Cairo",
        decor: "minimal"
    },
    aurora: {
        name: "Aurora",
        background: "linear-gradient(135deg, #312e81 0%, #4f46e5 48%, #06b6d4 100%)",
        titleColor: "#ffffff",
        bodyColor: "#eef2ff",
        accent: "#a5f3fc",
        font: "Cairo",
        decor: "aurora"
    },
    ocean: {
        name: "Ocean",
        background: "linear-gradient(135deg, #082f49 0%, #0369a1 55%, #0ea5e9 100%)",
        titleColor: "#ffffff",
        bodyColor: "#e0f2fe",
        accent: "#7dd3fc",
        font: "Cairo",
        decor: "ocean"
    },
    sunset: {
        name: "Sunset",
        background: "linear-gradient(135deg, #431407 0%, #c2410c 50%, #f59e0b 100%)",
        titleColor: "#ffffff",
        bodyColor: "#fff7ed",
        accent: "#fde68a",
        font: "Cairo",
        decor: "sunset"
    },
    midnight: {
        name: "Midnight",
        background: "linear-gradient(135deg, #020617 0%, #111827 50%, #312e81 100%)",
        titleColor: "#ffffff",
        bodyColor: "#cbd5e1",
        accent: "#818cf8",
        font: "Cairo",
        decor: "midnight"
    },
    paper: {
        name: "Paper",
        background: "#f5f0e8",
        titleColor: "#292524",
        bodyColor: "#57534e",
        accent: "#b45309",
        font: "Cairo",
        decor: "paper"
    }
};
const animations = {
    none: {
        name: "بدون حركة"
    },
    fade: {
        name: "Fade"
    },
    slideUp: {
        name: "Slide Up"
    },
    slideLeft: {
        name: "Slide Left"
    },
    slideRight: {
        name: "Slide Right"
    },
    zoom: {
        name: "Zoom"
    },
    pop: {
        name: "Pop"
    },
    rotate: {
        name: "Rotate"
    },
    typewriter: {
        name: "Typewriter"
    }
};
document.addEventListener("DOMContentLoaded", () => {
    loadProject();
    renderAll();
    document
        .getElementById("fileName")
        .addEventListener("input", event => {
        state.fileName =
            event.target.value || "Presentation";
        autoSave();
    });
});
function renderAll() {
    renderSlidesList();
    renderCurrentSlide();
    renderInspector();
    renderEditorNav();
}
function getCurrentSlide() {
    return state.slides[state.activeSlide];
}
function renderEditorNav() {
    const prev = document.getElementById("editorPrevBtn");
    const next = document.getElementById("editorNextBtn");
    const counter = document.getElementById("editorSlideCounter");
    if (!prev || !next || !counter) {
        return;
    }
    prev.disabled = state.activeSlide <= 0;
    next.disabled = state.activeSlide >= state.slides.length - 1;
    counter.textContent = `${state.activeSlide + 1} / ${state.slides.length}`;
}
function previousEditorSlide() {
    if (state.activeSlide <= 0) {
        return;
    }
    state.activeSlide--;
    state.selectedElement = { type: "title", index: -1 };
    renderAll();
}
function nextEditorSlide() {
    if (state.activeSlide >= state.slides.length - 1) {
        return;
    }
    state.activeSlide++;
    state.selectedElement = { type: "title", index: -1 };
    renderAll();
}
function renderSlidesList() {
    const list = document.getElementById("slidesList");
    list.innerHTML = "";
    state.slides.forEach((slide, index) => {
        const theme = themes[slide.theme] || themes.minimal;
        const item = document.createElement("div");
        item.className =
            "slide-thumb " +
                (index === state.activeSlide ? "active" : "");
        item.onclick = () => {
            state.activeSlide = index;
            state.selectedElement = {
                type: "title",
                index: -1
            };
            renderAll();
        };
        const thumb = document.createElement("div");
        thumb.className =
            "thumb-canvas";
        thumb.style.background =
            theme.background;
        const content = document.createElement("div");
        content.className =
            "thumb-content";
        const title = document.createElement("div");
        title.className =
            "thumb-title";
        title.style.color =
            theme.titleColor;
        title.textContent =
            slide.title || "";
        content.appendChild(title);
        slide.paragraphs
            .slice(0, 3)
            .forEach(paragraph => {
            const line = document.createElement("div");
            line.className =
                "thumb-line";
            line.style.background =
                theme.accent;
            content.appendChild(line);
        });
        thumb.appendChild(content);
        const label = document.createElement("div");
        label.className =
            "thumb-label";
        label.textContent =
            `شريحة ${index + 1}`;
        const deleteButton = document.createElement("button");
        deleteButton.className =
            "slide-delete";
        deleteButton.textContent =
            "×";
        deleteButton.title =
            "حذف الشريحة";
        deleteButton.onclick = event => {
            event.stopPropagation();
            deleteSlide(index);
        };
        item.appendChild(thumb);
        item.appendChild(deleteButton);
        item.appendChild(label);
        list.appendChild(item);
    });
}
function renderCurrentSlide() {
    const slide = getCurrentSlide();
    const theme = themes[slide.theme] || themes.minimal;
    const stage = document.getElementById("slideStage");
    stage.innerHTML = "";
    stage.style.background =
        theme.background;
    stage.style.fontFamily =
        `"${theme.font}", Arial, sans-serif`;
    addDecorations(stage, theme);
    const title = document.createElement("div");
    title.className =
        "slide-element main-title";
    title.style.left = "7%";
    title.style.top = "7%";
    title.style.width = "86%";
    title.style.height = "16%";
    title.style.color = theme.titleColor;
    title.style.fontSize = "clamp(24px, 3.4vw, 42px)";
    title.style.fontWeight = "900";
    title.style.display = "flex";
    title.style.alignItems = "center";
    title.style.justifyContent = "flex-start";
    title.style.textAlign = "right";
    title.style.direction = "rtl";
    title.style.lineHeight = "1.2";
    title.textContent =
        slide.title;
    if (state.selectedElement.type === "title") {
        title.style.outline =
            "2px solid rgba(91,92,226,.65)";
        title.style.outlineOffset =
            "5px";
        title.style.borderRadius =
            "7px";
    }
    title.onclick = event => {
        event.stopPropagation();
        state.selectedElement = {
            type: "title",
            index: -1
        };
        renderInspector();
        renderCurrentSlide();
    };
    stage.appendChild(title);
    const count = Math.max(slide.paragraphs.length, 1);
    slide.paragraphs
        .forEach((paragraph, index) => {
        const box = document.createElement("div");
        box.className =
            "slide-element paragraph-box";
        const top = 26 + (index * (64 / count));
        box.style.right =
            "7%";
        box.style.top =
            top + "%";
        box.style.width =
            "86%";
        box.style.height =
            Math.min(58, 62 / count) + "%";
        box.style.color =
            paragraph.color ||
                theme.bodyColor;
        box.style.textAlign =
            paragraph.align;
        if (state.selectedElement.type === "paragraph" &&
            state.selectedElement.index === index) {
            box.classList.add("selected");
        }
        const heading = document.createElement("div");
        heading.className =
            "paragraph-heading";
        heading.style.fontSize =
            Math.max(14, paragraph.fontSize * 0.65) + "px";
        heading.textContent =
            paragraph.heading || "";
        const body = document.createElement("div");
        body.className =
            "paragraph-body";
        body.style.fontSize =
            paragraph.fontSize + "px";
        body.style.fontWeight =
            paragraph.bold ? "800" : "500";
        body.textContent =
            paragraph.body ||
                "اكتب نص الفقرة هنا";
        box.appendChild(heading);
        box.appendChild(body);
        box.onclick = event => {
            event.stopPropagation();
            state.selectedElement = {
                type: "paragraph",
                index
            };
            renderInspector();
            renderCurrentSlide();
        };
        stage.appendChild(box);
        fitBox(box);
    });
    if (slide.paragraphs.length === 0) {
        const empty = document.createElement("div");
        empty.className =
            "empty-slide";
        empty.textContent =
            "اضغط + لإضافة أول فقرة";
        stage.appendChild(empty);
    }
}
function addDecorations(stage, theme) {
    const decoration = document.createElement("div");
    decoration.className =
        "slide-decor";
    if (theme.decor === "aurora") {
        decoration.style.width = "360px";
        decoration.style.height = "360px";
        decoration.style.borderRadius = "50%";
        decoration.style.right = "-120px";
        decoration.style.bottom = "-150px";
        decoration.style.background =
            "rgba(165, 243, 252, .14)";
        decoration.style.filter =
            "blur(8px)";
        stage.appendChild(decoration);
        const ring = document.createElement("div");
        ring.className =
            "slide-decor";
        ring.style.width = "180px";
        ring.style.height = "180px";
        ring.style.border = "2px solid rgba(255,255,255,.14)";
        ring.style.borderRadius = "50%";
        ring.style.left = "-80px";
        ring.style.top = "-70px";
        stage.appendChild(ring);
    }
    else if (theme.decor === "ocean") {
        decoration.style.width = "300px";
        decoration.style.height = "300px";
        decoration.style.borderRadius = "50%";
        decoration.style.left = "-110px";
        decoration.style.bottom = "-100px";
        decoration.style.background =
            "rgba(125, 211, 252, .12)";
        decoration.style.filter =
            "blur(5px)";
        stage.appendChild(decoration);
    }
    else if (theme.decor === "sunset") {
        decoration.style.width = "280px";
        decoration.style.height = "280px";
        decoration.style.borderRadius = "50%";
        decoration.style.right = "-80px";
        decoration.style.top = "-100px";
        decoration.style.background =
            "rgba(253, 230, 138, .18)";
        decoration.style.filter =
            "blur(7px)";
        stage.appendChild(decoration);
    }
    else if (theme.decor === "midnight") {
        decoration.style.width = "420px";
        decoration.style.height = "420px";
        decoration.style.borderRadius = "50%";
        decoration.style.right = "-150px";
        decoration.style.bottom = "-170px";
        decoration.style.background =
            "rgba(129, 140, 248, .11)";
        decoration.style.filter =
            "blur(14px)";
        stage.appendChild(decoration);
    }
    else if (theme.decor === "paper") {
        decoration.style.width = "120px";
        decoration.style.height = "120px";
        decoration.style.borderRadius = "50%";
        decoration.style.right = "7%";
        decoration.style.bottom = "8%";
        decoration.style.background =
            "rgba(180,83,9,.08)";
        stage.appendChild(decoration);
    }
}
function renderInspector() {
    const content = document.getElementById("inspectorContent");
    const title = document.getElementById("inspectorTitle");
    const description = document.getElementById("inspectorDescription");
    const slide = getCurrentSlide();
    if (state.selectedElement.type === "title") {
        title.textContent =
            "عنوان الشريحة";
        description.textContent =
            "عدّل العنوان الرئيسي للسلايد";
        content.innerHTML = `

                <div class="section">

                    <div class="section-title">
                        المحتوى
                    </div>

                    <div class="field">

                        <label>
                            العنوان
                        </label>

                        <input
                            id="titleInput"
                            value="${escapeAttribute(slide.title)}"
                            placeholder="اكتب عنوان السلايد..."
                        >

                    </div>

                </div>

                <div class="section">

                    <div class="section-title">
                        تصميم الشريحة
                    </div>

                    <div class="field">

                        <label>
                            القالب الحالي
                        </label>

                        <select
                            id="themeSelect"
                        >

                            ${Object.entries(themes)
            .map(([key, value]) => `
                                    <option
                                        value="${key}"
                                        ${slide.theme === key ? "selected" : ""}
                                    >
                                        ${value.name}
                                    </option>
                                `)
            .join("")}

                        </select>

                    </div>

                </div>

                <div class="section">

                    <div class="section-title">
                        Animation للعنوان
                    </div>

                    <select
                        id="titleAnimation"
                    >

                        ${Object.entries(animations)
            .map(([key, value]) => `
                                <option value="${key}">
                                    ${value.name}
                                </option>
                            `)
            .join("")}

                    </select>

                    <div class="animation-preview">

                        <div
                            id="animationDemo"
                            class="animation-demo"
                        >
                            العنوان
                        </div>

                    </div>

                </div>

            `;
        document
            .getElementById("titleInput")
            .addEventListener("input", event => {
            slide.title =
                event.target.value;
            renderCurrentSlide();
            renderSlidesList();
            autoSave();
        });
        document
            .getElementById("themeSelect")
            .addEventListener("change", event => {
            slide.theme =
                event.target.value;
            renderAll();
            autoSave();
        });
        document
            .getElementById("titleAnimation")
            .addEventListener("change", event => {
            playAnimationDemo(event.target.value);
        });
        return;
    }
    const index = state.selectedElement.index;
    const paragraph = slide.paragraphs[index];
    if (!paragraph) {
        state.selectedElement = {
            type: "title",
            index: -1
        };
        renderInspector();
        return;
    }
    title.textContent =
        `الفقرة ${index + 1}`;
    description.textContent =
        "المحتوى والتنسيق والأنيميشن";
    content.innerHTML = `

            <div class="section">

                <div class="section-title">
                    النص
                </div>

                <div class="field">

                    <label>
                        عنوان الفقرة
                    </label>

                    <input
                        id="paragraphHeading"
                        value="${escapeAttribute(paragraph.heading)}"
                        placeholder="مثال: مقدمة"
                    >

                </div>

                <div class="field">

                    <label>
                        محتوى الفقرة
                    </label>

                    <textarea
                        id="paragraphBody"
                        placeholder="اكتب محتوى الفقرة..."
                    >${escapeHtml(paragraph.body)}</textarea>

                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    الكتابة
                </div>

                <div class="row">

                    <div class="field">

                        <label>
                            حجم الخط
                        </label>

                        <input
                            type="number"
                            id="fontSizeInput"
                            value="${paragraph.fontSize}"
                            min="10"
                            max="80"
                        >

                    </div>

                    <div class="field">

                        <label>
                            لون النص
                        </label>

                        <input
                            type="color"
                            id="colorInput"
                            value="${paragraph.color}"
                        >

                    </div>

                </div>

                <div class="field">

                    <label>

function getExportBackground(background) {
    if (!background ||
        background.startsWith("linear-gradient")) {
        if (background.includes("312e81")) {
            return "4F46E5";
        }
        if (background.includes("082f49")) {
            return "0369A1";
        }
        if (background.includes("431407")) {
            return "C2410C";
        }
        if (background.includes("020617")) {
            return "111827";
        }
        return "F8FAFC";
    }
    return cleanColor(background);
}
function cleanColor(color) {
    return String(color || "#000000")
        .replace("#", "")
        .substring(0, 6)
        .toUpperCase();
}
function convertAlign(align) {
    if (align === "center") {
        return "center";
    }
    if (align === "left") {
        return "left";
    }
    return "right";
}

<script>
(function(){
    'use strict';

    const SMART = {};
    SMART.uid = () => crypto.randomUUID();

    SMART.imageHeightPct = o => {
        const ratio = Math.max(.1, Number(o.ratio) || 1.5);
        return Number(o.w || 0) * (16 / 9) / ratio;
    };

    SMART.rectOverlap = (a,b,gap=1.5) => {
        return !(
            a.x + a.w <= b.x + gap ||
            b.x + b.w <= a.x + gap ||
            a.y + a.h <= b.y + gap ||
            b.y + b.h <= a.y + gap
        );
    };

    SMART.safeClamp = (n,min,max) => Math.max(min,Math.min(max,n));

    SMART.arrangeSlide = function(slide){
        if (!slide || !Array.isArray(slide.paragraphs)) {
            return;
        }

        const cards = slide.paragraphs;
        const images = (slide.images || []).filter(x => x && x.src && x.type !== 'video');
        const area = { x:5, y:22, w:90, h:69 };
        const rightImages = images.filter(x => Number(x.x||0) >= 58);
        const leftImages = images.filter(x => Number(x.x||0) + Number(x.w||0) <= 42);
        const midImages = images.filter(x => !rightImages.includes(x) && !leftImages.includes(x));

        let cx = area.x, cy = area.y, cw = area.w, ch = area.h;

        if (rightImages.length && !leftImages.length && !midImages.length) {
            const edge = Math.min(...rightImages.map(x => Number(x.x||0)));
            cw = Math.max(44, Math.min(60, edge - 8));
        }
        else if (leftImages.length && !rightImages.length && !midImages.length) {
            const edge = Math.max(...leftImages.map(x => Number(x.x||0) + Number(x.w||0)));
            cx = Math.min(50, edge + 7);
            cw = Math.max(42, 95 - cx);
        }
        else if (midImages.length) {
            const occupiedTop = midImages.reduce((m,x) => Math.min(m, Number(x.y||50)), 100);
            const occupiedBottom = midImages.reduce((m,x) => Math.max(m, Number(x.y||50) + SMART.imageHeightPct(x)), 0);
            if (occupiedTop > 30) {
                cy = 22;
                ch = Math.max(24, occupiedTop - cy - 4);
            }
            else if (occupiedBottom < 84) {
                cy = occupiedBottom + 4;
                ch = Math.max(24, 91 - cy);
            }
        }

        const n = cards.length;
        if (!n) {
            return;
        }

        if (images.length === 0 && cw >= 70) {
            let cols, rows;
            if (n === 1) { cols=1; rows=1; }
            else if (n === 2) { cols=1; rows=2; }
            else if (n === 3) { cols=3; rows=1; }
            else if (n === 4) { cols=2; rows=2; }
            else if (n <= 6) { cols=3; rows=Math.ceil(n/3); }
            else { cols=2; rows=Math.ceil(n/2); }

            const gapX = cols === 1 ? 0 : 3;
            const gapY = rows === 1 ? 0 : 3;
            const colW = (cw - gapX*(cols-1)) / cols;
            const rowH = (ch - gapY*(rows-1)) / rows;

            cards.forEach((p,i)=>{
                const col = i % cols;
                const row = Math.floor(i / cols);
                p.g = [
                    +(cx + col*(colW+gapX)).toFixed(2),
                    +(cy + row*(rowH+gapY)).toFixed(2),
                    +colW.toFixed(2),
                    +Math.max(14,rowH).toFixed(2)
                ];
                p.card = p.card !== false;
            });
        }
        else {
            const gap = n <= 3 ? 3 : 2.5;
            let rows = n;
            let h = (ch - gap*(rows-1)) / rows;
            if (h < 16) {
                rows = Math.ceil(n/2);
                h = (ch - gap*(rows-1)) / rows;
            }
            if (h < 16) {
                rows = Math.ceil(n/3);
                h = (ch - gap*(rows-1)) / rows;
            }
            const cols = rows < n && h >= 18 ? Math.ceil(n/rows) : 1;
            const colGap = 3;
            const colW = cols === 1 ? cw : (cw - colGap*(cols-1))/cols;

            cards.forEach((p,i)=>{
                const row = Math.floor(i/cols);
                const col = i%cols;
                p.g = [
                    +(cx + col*(colW+colGap)).toFixed(2),
                    +(cy + row*(h+gap)).toFixed(2),
                    +colW.toFixed(2),
                    +Math.max(14,h).toFixed(2)
                ];
                p.card = p.card !== false;
            });
        }

        // Final collision pass: push cards down if something still overlaps.
        const placed = [];
        cards.forEach(p=>{
            const r = {x:+p.g[0],y:+p.g[1],w:+p.g[2],h:+p.g[3]};
            for(let guard=0; guard<30; guard++){
                const hit = placed.find(x=>SMART.rectOverlap(r,x,1));
                if(!hit) break;
                r.y = hit.y + hit.h + 1.5;
                if(r.y+r.h > 93){
                    r.y = 22;
                    r.x += Math.min(4, r.w*.08);
                }
            }
            r.x = SMART.safeClamp(r.x,3,97-r.w);
            r.y = SMART.safeClamp(r.y,21,94-r.h);
            p.g = [
                +r.x.toFixed(2),+r.y.toFixed(2),+r.w.toFixed(2),+r.h.toFixed(2)
            ];
            placed.push(r);
        });
    };

    SMART.reflowAfterImageDelete = function(slide){
        SMART.arrangeSlide(slide);
    };

    SMART.processImage = function(file, cb){
        const reader = new FileReader();
        reader.onload = ()=>{
            const img = new Image();
            img.onload = ()=>{
                const w = img.naturalWidth, h = img.naturalHeight;
                const scale = Math.min(1,1600/Math.max(w,h));
                let src = reader.result;
                if(file.type !== 'image/gif' && (scale < 1 || file.size > 600000)){
                    const c = document.createElement('canvas');
                    c.width = Math.round(w*scale);
                    c.height = Math.round(h*scale);
                    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
                    src = c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg',.86);
                }
                cb({
                    id:SMART.uid(),
                    src,
                    ratio:w/h,
                    x:68,
                    y:24,
                    w:25,
                    alt:file.name,
                    animation:'fade',
                    duration:.8,
                    delay:0,
                    trigger:'with'
                });
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
    };

    SMART.ensureModal = function(){
        let m = document.getElementById('smartPageModal');
        if(m) return m;
        m = document.createElement('div');
        m.id='smartPageModal';
        m.className='smart-page-modal';
        m.innerHTML=`
            <div class="smart-page-card">
                <div class="smart-page-head">
                    <div>
                        <h3>تحرير الصفحة بالكامل</h3>
                        <p>عدّل عنوان الصفحة، الكروت، والصور وشوف البريفيو في نفس الوقت</p>
                    </div>
                    <div class="smart-page-head-actions">
                        <button onclick="smartRunPreview()">تشغيل البريفيو</button>
                        <button onclick="smartArrangeCurrent()">رتّب تلقائيًا</button>
                        <button class="primary" onclick="smartClosePageEditor(true)">حفظ وإغلاق</button>
                        <button class="danger" onclick="smartClosePageEditor(false)">إلغاء</button>
                    </div>
                </div>
                <div class="smart-page-body">
                    <div class="smart-page-editor">
                        <div class="smart-editor-section">
                            <div class="smart-editor-section-title">عنوان الصفحة</div>
                            <input id="smartPageTitle" class="smart-editor-title-input" placeholder="عنوان الصفحة...">
                        </div>
                        <div class="smart-editor-section">
                            <div class="smart-editor-section-title">الكروت / الفقرات</div>
                            <div id="smartCardsList" class="smart-card-list"></div>
                            <div class="smart-editor-actions">
                                <button class="primary" onclick="smartAddCard()">+ كرت شرح جديد</button>
                                <button onclick="smartArrangeCurrent()">إعادة ترتيب الكروت</button>
                            </div>
                        </div>
                        <div class="smart-editor-section">
                            <div class="smart-editor-section-title">صور الصفحة</div>
                            <div id="smartImagesList" class="smart-image-list"></div>
                            <div class="smart-editor-actions">
                                <button class="primary" onclick="smartAddImage()">+ إضافة صورة</button>
                                <button onclick="smartAddImageToCurrentSlot()">+ صورة مكانية</button>
                            </div>
                        </div>
                    </div>
                    <div class="smart-page-preview-wrap">
                        <div class="smart-preview-title">بريفيو الصفحة</div>
                        <div id="smartPreviewStage" class="smart-preview-stage"></div>
                    </div>
                </div>
            </div>`;
        m.addEventListener('click',e=>{if(e.target===m) SMART.closeEditor(false);});
        document.body.appendChild(m);
        return m;
    };

    SMART.currentSlide = ()=>getCurrentSlide();

    SMART.openEditor = function(index = state.activeSlide){
        if(index<0 || index>=state.slides.length) return;
        state.activeSlide=index;
        state.selectedElement={type:'title',index:-1};
        const m=SMART.ensureModal();
        m.classList.add('open');
        SMART.renderFields();
        SMART.renderPreview();
    };

    SMART.closeEditor = function(save){
        if(save){
            SMART.arrangeSlide(SMART.currentSlide());
            renderAll();
            autoSave();
        }
        document.getElementById('smartPageModal')?.classList.remove('open');
    };

    SMART.renderFields = function(){
        const s=SMART.currentSlide();
        if(!s) return;
        const title=document.getElementById('smartPageTitle');
        if(title){
            title.value=s.title||'';
            title.oninput=e=>{s.title=e.target.value;SMART.renderPreview();};
        }

        const cards=document.getElementById('smartCardsList');
        cards.innerHTML='';
        (s.paragraphs||[]).forEach((p,i)=>{
            const box=document.createElement('div');
            box.className='smart-card-editor';
            box.innerHTML=`
                <div class="smart-card-editor-head">
                    <strong>الكرت ${i+1}</strong>
                    <button type="button" title="حذف الكرت">×</button>
                </div>
                <input class="sc-heading" value="${SMART.esc(p.heading||'')}" placeholder="عنوان الكرت">
                <textarea class="sc-body" placeholder="شرح الكرت...">${SMART.escText(p.body||'')}</textarea>`;
            box.querySelector('button').onclick=()=>{
                s.paragraphs.splice(i,1);
                SMART.arrangeSlide(s);
                SMART.renderFields();
                SMART.renderPreview();
            };
            box.querySelector('.sc-heading').oninput=e=>{p.heading=e.target.value;SMART.renderPreview();};
            box.querySelector('.sc-body').oninput=e=>{p.body=e.target.value;SMART.renderPreview();};
            cards.appendChild(box);
        });
        if(!s.paragraphs.length){
            cards.innerHTML='<div class="smart-empty-note">مفيش كروت حاليًا. اضغط «كرت شرح جديد» وابدأ اكتب محتوى الصفحة.</div>';
        }

        const images=document.getElementById('smartImagesList');
        images.innerHTML='';
        (s.images||[]).filter(x=>x && x.src).forEach((im,i)=>{
            const row=document.createElement('div');
            row.className='smart-image-row';
            row.innerHTML=`
                <img class="smart-image-thumb" src="${im.src}">
                <div><div class="smart-image-name">${SMART.escText(im.alt||('صورة '+(i+1)))}</div><div class="smart-image-sub">X: ${Number(im.x||0).toFixed(1)}% · Y: ${Number(im.y||0).toFixed(1)}%</div></div>
                <div class="smart-image-actions"><button class="rep">تغيير</button><button class="del">حذف</button></div>`;
            row.querySelector('.rep').onclick=()=>SMART.replaceImage(i);
            row.querySelector('.del').onclick=()=>{
                s.images.splice(i,1);
                SMART.arrangeSlide(s);
                SMART.renderFields();
                SMART.renderPreview();
            };
            images.appendChild(row);
        });
        if(!(s.images||[]).length){
            images.innerHTML='<div class="smart-empty-note">مفيش صور. أضف صورة، وبعدها حرّكها وكبّرها من المحرر العادي براحتك.</div>';
        }
    };

    SMART.esc = value=>String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    SMART.escText = value=>String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    SMART.renderPreview = function(){
        const s=SMART.currentSlide();
        const st=document.getElementById('smartPreviewStage');
        if(!st || !s) return;
        const th=themes[s.theme] || themes.soft || themes.minimal;
        st.innerHTML='';
        st.style.background=th.background;
        st.style.fontFamily=`"${th.font||'Cairo'}",Arial,sans-serif`;
        const title=document.createElement('div');
        title.className='smart-preview-title';
        title.style.left='7%';
        title.style.right='7%';
        title.style.top=(s.tt||6)+'%';
        title.style.width='86%';
        title.style.height=(s.th||13)+'%';
        title.style.color=th.titleColor;
        title.style.fontSize=Math.max(19,Math.min(38,(s.ts||40)*.58))+'px';
        title.style.fontWeight='900';
        title.style.display='flex';
        title.style.alignItems='center';
        title.style.justifyContent=s.center?'center':'flex-start';
        title.style.textAlign=s.center?'center':(s.ltr?'left':'right');
        title.style.direction=s.ltr?'ltr':'rtl';
        title.textContent=s.title||'';
        st.appendChild(title);

        (s.paragraphs||[]).forEach((p,i)=>{
            const g=p.g || [7,26,86,30];
            const box=document.createElement('div');
            box.className='smart-preview-card'+(p.card===false?'':' has-card');
            box.style.left=g[0]+'%';
            box.style.top=g[1]+'%';
            box.style.width=g[2]+'%';
            box.style.height=g[3]+'%';
            box.style.color=p.color||th.bodyColor;
            box.style.textAlign=p.align||'left';
            box.style.direction=s.ltr?'ltr':'rtl';
            const h=document.createElement('h4');
            h.style.color=p.hc||p.color||th.accent||th.titleColor;
            h.textContent=p.heading||'';
            const b=document.createElement('p');
            b.style.fontSize=Math.max(8,(Number(p.fontSize)||18)*.43)+'px';
            b.style.fontWeight=p.bold?'800':'500';
            b.textContent=p.body||'';
            box.append(h,b);
            st.appendChild(box);
        });

        (s.images||[]).filter(x=>x && x.src).forEach(im=>{
            const img=document.createElement('img');
            img.className='smart-preview-img';
            img.src=im.src;
            img.style.left=im.x+'%';
            img.style.top=im.y+'%';
            img.style.width=im.w+'%';
            img.style.height=SMART.imageHeightPct(im)+'%';
            img.style.zIndex=3;
            st.appendChild(img);
        });
    };

    SMART.addCard = function(){
        const s=SMART.currentSlide();
        if(!s) return;
        const n=(s.paragraphs||[]).length+1;
        s.paragraphs=s.paragraphs||[];
        s.paragraphs.push({
            id:SMART.uid(),
            heading:`شرح النقطة ${n}`,
            body:'اكتب هنا شرح النقطة بالتفصيل.',
            fontSize:18,
            color:themes[s.theme]?.bodyColor||'#14243f',
            hc:themes[s.theme]?.accent||'#2563eb',
            card:true,
            animation:'fade',
            duration:.8,
            delay:0,
            trigger:'click',
            align:'left',
            bold:false,
            g:[7,26,40,24]
        });
        SMART.arrangeSlide(s);
        state.selectedElement={type:'paragraph',index:s.paragraphs.length-1};
        SMART.renderFields();
        SMART.renderPreview();
        renderAll();
        autoSave();
    };

    SMART.addImage = function(){
        const input=document.createElement('input');
        input.type='file';
        input.accept='image/*';
        input.onchange=()=>{
            const file=input.files[0];
            if(!file) return;
            SMART.processImage(file,im=>{
                const s=SMART.currentSlide();
                const count=(s.images||[]).length;
                im.x=count%2===0?68:5;
                im.y=count%2===0?24:24;
                im.w=25;
                s.images=s.images||[];
                s.images.push(im);
                SMART.arrangeSlide(s);
                SMART.renderFields();
                SMART.renderPreview();
                renderAll();
                autoSave();
            });
        };
        input.click();
    };

    SMART.addImageToCurrentSlot=function(){
        const input=document.createElement('input');
        input.type='file'; input.accept='image/*';
        input.onchange=()=>{
            const file=input.files[0]; if(!file) return;
            SMART.processImage(file,im=>{
                const s=SMART.currentSlide();
                im.x=68; im.y=24; im.w=25;
                s.images=s.images||[];
                s.images.push(im);
                SMART.arrangeSlide(s);
                SMART.renderFields(); SMART.renderPreview(); renderAll(); autoSave();
            });
        };
        input.click();
    };

    SMART.replaceImage=function(i){
        const input=document.createElement('input'); input.type='file'; input.accept='image/*';
        input.onchange=()=>{
            const file=input.files[0]; if(!file) return;
            SMART.processImage(file,im=>{
                const s=SMART.currentSlide();
                const old=s.images[i];
                if(old){im.x=old.x;im.y=old.y;im.w=old.w;im.animation=old.animation;im.duration=old.duration;im.delay=old.delay;im.trigger=old.trigger;}
                s.images[i]=im;
                SMART.renderFields(); SMART.renderPreview(); renderAll(); autoSave();
            });
        };
        input.click();
    };

    SMART.runPreview=function(){
        SMART.closeEditor(true);
        previewSlideIndex=state.activeSlide;
        document.getElementById('previewModal')?.classList.add('open');
        if(typeof renderPreview==='function') renderPreview();
    };

    SMART.closePageEditor=function(save){SMART.closeEditor(save);};
    SMART.arrangeCurrent=function(){
        const s=SMART.currentSlide();
        SMART.arrangeSlide(s);
        SMART.renderFields(); SMART.renderPreview(); renderAll(); autoSave();
        showToast('تم ترتيب الكروت بدون تداخل');
    };

    window.smartOpenPageEditor = SMART.openEditor;
    window.smartClosePageEditor = SMART.closeEditor;
    window.smartAddCard = SMART.addCard;
    window.smartAddImage = SMART.addImage;
    window.smartAddImageToCurrentSlot = SMART.addImageToCurrentSlot;
    window.smartRunPreview = SMART.runPreview;
    window.smartArrangeCurrent = SMART.arrangeCurrent;

    const oldDelImg = window.delImg;
    window.delImg = function(i){
        const s=getCurrentSlide();
        if(!s || !s.images || !s.images[i]) return;
        s.images.splice(i,1);
        SMART.arrangeSlide(s);
        state.selectedElement={type:'title',index:-1};
        renderAll();
        autoSave();
        if(document.getElementById('smartPageModal')?.classList.contains('open')){
            SMART.renderFields(); SMART.renderPreview();
        }
        showToast('اتحذفت الصورة والكروت اترتبت تلقائيًا');
    };

    const oldAddSlide = window.addSlide;
    window.addSlide = function(){
        oldAddSlide();
        const s=getCurrentSlide();
        if(s){
            s.paragraphs=s.paragraphs||[];
            if(!s.paragraphs.length){
                s.paragraphs.push({id:SMART.uid(),heading:'شرح النقطة الأولى',body:'اكتب محتوى الصفحة هنا.',fontSize:18,color:themes[s.theme]?.bodyColor||'#14243f',hc:themes[s.theme]?.accent||'#2563eb',card:true,animation:'fade',duration:.8,delay:0,trigger:'click',align:'left',bold:false});
            }
            SMART.arrangeSlide(s);
            autoSave();
            state.selectedElement={type:'title',index:-1};
            renderAll();
            SMART.openEditor(state.activeSlide);
        }
    };

    // Replace the existing quick "paragraph" label with the more useful card wording.
    const renameQuickButtons=()=>{
        document.querySelectorAll('.editor-toolbar .tool-button').forEach(b=>{
            if((b.textContent||'').includes('فقرة')) b.textContent='＋ كرت شرح';
        });
    };

    const addToolbarButton=()=>{
        const left=document.querySelector('.editor-toolbar-left');
        if(!left || left.querySelector('[data-smart-page-editor]')) return;
        const b=document.createElement('button');
        b.className='top-btn smart-toolbar-btn';
        b.setAttribute('data-smart-page-editor','1');
        b.textContent='تحرير الصفحة';
        b.onclick=()=>SMART.openEditor(state.activeSlide);
        left.prepend(b);
    };

    const hook=()=>{renameQuickButtons();addToolbarButton();};
    hook();
    setTimeout(hook,250);
    setTimeout(hook,800);
})();
</script>
</body>
</html>
